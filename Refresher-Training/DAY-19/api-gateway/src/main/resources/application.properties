spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.auth-service-cb.sliding-window-size=5
resilience4j.circuitbreaker.instances.auth-service-cb.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.auth-service-cb.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.auth-service-cb.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.auth-service-cb.register-health-indicator=true

resilience4j.circuitbreaker.instances.notes-service-cb.sliding-window-size=5
resilience4j.circuitbreaker.instances.notes-service-cb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notes-service-cb.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notes-service-cb.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.notes-service-cb.register-health-indicator=true
