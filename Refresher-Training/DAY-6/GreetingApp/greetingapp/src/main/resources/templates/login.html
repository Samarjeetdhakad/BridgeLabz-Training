<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	
	<head>
		<title>login</title>
		<link rel="stylesheet" href="/css/style.css">
	</head>
	
	<body>
		<div class="container">
					
			<h1>Login</h1>
			
			        <p class="success"
					th:if="${message}"
					th:text="${message}"></p>
				   
			       <p class="error"
			          th:if="${error}"
			          th:text="${error}">
			       </p>

			       <form action="/login"
			             method="post">

			           <label>Email</label>

			           <input type="email"
			                  name="email"
			                  required>

			           <label>Password</label>

			           <input type="password"
			                  name="password"
			                  required>

			           <button type="submit">
			               Login
			           </button>
			       </form>

			       <p>
			           Don't have an account
			           <a href="/register">
			               Register
			           </a>

			       </p>
			
		</div>
	</body>
	
</html>
